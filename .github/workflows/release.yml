name: Release

# Push a tag like v1.0.0 to build the Windows installer, upload it to a draft
# release, write the changelog from the commit titles, and publish it. Installed
# copies only see published releases, so users never get a half-uploaded one.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history and tags, for the changelog

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $v"
            exit 1
          fi

      - run: npm ci

      - name: Write the changelog from commit titles
        shell: bash
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "$range" \
              | grep -vE '^- (Initial commit|Release v[0-9])' || true
            if [ -n "$prev" ]; then
              echo
              echo "**Full diff:** https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > notes.md
          cat notes.md

      # electron-builder uploads each target through its own publisher, and when
      # no release exists each one creates a draft, leaving the files split
      # across two releases. It reuses an existing draft, so create it first.
      - name: Create the draft release
        shell: bash
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload to the draft release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing without latest.yml would break updates for everyone installed.
      - name: Check every file reached the draft
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          have="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$have"
          for f in "Booth-Setup-$v.exe" "Booth-Setup-$v.exe.blockmap" "Booth-$v-portable.exe" latest.yml; do
            grep -qxF "$f" <<< "$have" || { echo "::error::$f is missing from the draft release"; exit 1; }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
